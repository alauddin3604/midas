name: midas
recipe: laravel
config:
  php: '8.4'
  webroot: public
services:
  appserver:
    build_as_root:
      - curl -sL https://deb.nodesource.com/setup_24.x | bash -
      - apt-get update -y
      - apt-get install -y nodejs
    build:
      - npm install
    ssl: true
    ports:
      - '5173:5173'
    overrides:
      environment:
        # Compiled Blade/Livewire classes embed absolute paths (/app here, /Users/... on the host),
        # so the container keeps its own copy instead of sharing storage/framework/views.
        VIEW_COMPILED_PATH: /tmp/laravel-views
  database:
    portforward: 3333

tooling:
  npm:
    service: appserver
  node:
    service: appserver